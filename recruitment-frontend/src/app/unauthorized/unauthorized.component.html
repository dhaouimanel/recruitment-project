<div class="unauthorized-container">
  <div class="error-card">
    <div class="error-icon">
      <i class="fas fa-lock fa-4x"></i>
    </div>

    <h1><i class="fas fa-ban"></i> Accès non autorisé</h1>

    <div class="error-details" *ngIf="requiredRole || currentRole">
      <p *ngIf="requiredRole">
        <strong>Rôle requis:</strong> {{ requiredRole }}
      </p>
      <p *ngIf="currentRole"><strong>Votre rôle:</strong> {{ currentRole }}</p>
    </div>

    <p class="error-message">
      Vous n'avez pas les permissions nécessaires pour accéder à cette page.
    </p>

    <div class="actions">
      <button class="btn btn-primary" routerLink="/">
        <i class="fas fa-home"></i> Retour à l'accueil
      </button>

      <button class="btn btn-secondary" (click)="goBack()" *ngIf="canGoBack">
        <i class="fas fa-arrow-left"></i> Retour
      </button>

      <button class="btn btn-outline" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i> Se reconnecter
      </button>
    </div>
  </div>
</div>
