<div class="reset-wrapper">
  <div class="reset-card">
    <div class="card-header">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h2>Nouveau mot de passe</h2>
      <p *ngIf="token; else noToken">
        Veuillez saisir votre nouveau mot de passe.
      </p>
      <ng-template #noToken>
        <p class="error-message">{{ error || "Lien invalide ou expiré." }}</p>
      </ng-template>
    </div>

    <form (ngSubmit)="onSubmit()" #resetForm="ngForm" *ngIf="token">
      <div class="input-group">
        <label for="newPassword">Nouveau mot de passe</label>
        <div class="input-icon-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
            minlength="6"
            #newPass="ngModel"
            placeholder="••••••"
          />
        </div>
        <div *ngIf="newPass.invalid && newPass.touched" class="error-message">
          Minimum 6 caractères.
        </div>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <div class="input-icon-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            #confirmPass="ngModel"
            placeholder="••••••"
          />
        </div>
        <div
          *ngIf="confirmPass.touched && newPassword !== confirmPassword"
          class="error-message"
        >
          Les mots de passe ne correspondent pas.
        </div>
      </div>

      <button type="submit" class="btn-reset" [disabled]="resetForm.invalid || isLoading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span *ngIf="!isLoading">Réinitialiser</span>
        <span *ngIf="isLoading">En cours...</span>
      </button>

      <div *ngIf="message" class="alert success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ message }}
      </div>
      <div *ngIf="error && token" class="alert error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ error }}
      </div>
    </form>

    <div class="card-footer" *ngIf="!token">
      <a routerLink="/forgot-password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Demander un nouveau lien
      </a>
    </div>
  </div>
</div>
