<!-- forgot-password.component.html -->
<div class="forgot-wrapper">
  <div class="forgot-card">
    <div class="card-header">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7.5a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM9 14a6 6 0 00-6 6h12a6 6 0 00-6-6z" />
        </svg>
      </div>
      <h2>Mot de passe oublié ?</h2>
      <p>Ne vous inquiétez pas, cela arrive. Entrez votre email et nous vous enverrons un lien de réinitialisation.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
      <div class="input-group">
        <label for="email">Adresse email</label>
        <div class="input-icon-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            #emailInput="ngModel"
            placeholder="exemple@entreprise.com"
          />
        </div>
        <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
          Veuillez entrer une adresse email valide.
        </div>
      </div>

      <button type="submit" class="btn-reset" [disabled]="forgotForm.invalid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        Envoyer le lien
      </button>

      <div *ngIf="message" class="alert success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ message }}
      </div>
      <div *ngIf="error" class="alert error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ error }}
      </div>
    </form>

    <div class="card-footer">
      <a routerLink="/login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Retour à la connexion
      </a>
    </div>
  </div>
</div>
